services:
  db:
    image: postgres:18-alpine
    container_name: mparc_postgres_db
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./sql:/docker-entrypoint-initdb.d
  
  backend:
    build: ./backend
    container_name: mparc_backend
    env_file:
      - .env
    ports:
      - "3000:3000"
    depends_on:
      - db
  
  frontend:
    build: ./frontend
    container_name: mparc_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  postgres_data: